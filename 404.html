<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pàgina no trobada — Pensa en Blanes</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: var(--marine);
    color: var(--white);
  }
  .notfound img { height: 56px; margin-bottom: 2rem; filter: brightness(0) invert(1); }
  .notfound h1 { color: var(--white); font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 1rem; }
  .notfound p { color: rgba(255,255,255,0.75); max-width: 40ch; }
</style>
</head>
<body>
<div class="notfound">
  <img src="assets/logo.png" alt="Pensa en Blanes">
  <h1>Aquesta pàgina no existeix</h1>
  <p>Sembla que l'enllaç no és correcte o la pàgina s'ha mogut. Torna a la pàgina principal per continuar navegant.</p>
  <a href="/" class="btn btn-primary" style="margin-top:2rem;">Tornar a l'inici →</a>
</div>
</body>
</html>
